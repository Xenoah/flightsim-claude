[package]
name = "flightsim-app"
description = "統合バイナリ。"
version.workspace = true
edition.workspace = true
# ADR-0007: Bevy 0.18.1 の MSRV。純 Rust 側 (core/fdm/world/sim/tilegen) は
# 1.85 のまま据え置き、古いツールチェーンで動く性質を維持する。
rust-version = "1.89"
license.workspace = true

[features]
# Ordinary builds retain Bevy's LUT bundle and implicit Tony camera default.
default = ["bevy/tonemapping_luts"]
# Alternate appearance; select with --no-default-features. Not a release recipe.
analytic-tonemapping = ["bevy/ktx2", "flightsim-render/analytic-tonemapping"]
# Local commercial candidate: original Swift Sport, isolated adjacent assets.
# This feature is not a legal clearance or a Steam release switch.
commercial-staging = []
# Explicit map acquisition; default and commercial candidate stay offline.
region-downloads = ["flightsim-content/downloads"]

[dependencies]
flightsim-core.workspace = true
flightsim-fdm.workspace = true
flightsim-world.workspace = true
flightsim-content.workspace = true
flightsim-sim.workspace = true
flightsim-render.workspace = true
flightsim-input.workspace = true
flightsim-audio.workspace = true
flightsim-ui.workspace = true
flightsim-net.workspace = true
bevy.workspace = true
# Bevy does not re-export PollError. Use the already-locked type directly rather
# than classifying production errors by their display/debug strings.
wgpu-types = { version = "=27.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
