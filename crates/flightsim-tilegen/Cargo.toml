[package]
name = "flightsim-tilegen"
description = "Copernicus DEM と OSM 空港データを実行時形式へ焼くオフライン CLI。"
default-run = "flightsim-tilegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# オフラインのツールなので flightsim-world に依存してよい（依存の向きは正しい）。
# ただし `bevy` は不可。焼き込み処理に描画エンジンは要らない。
[dependencies]
flightsim-core.workspace = true
flightsim-world.workspace = true
clap = { version = "4", features = ["derive"] }
earcutr = "=0.5.0"
# OSM PBF はこのオフライン変換ツールだけで読む。実行時クレートへは入れない。
# 0.3.7 は MIT OR Apache-2.0、MSRV 1.82 でワークスペースの MSRV 内。
osmpbf = "=0.3.7"
same-file = "1"
tempfile = "3"
tiff = "0.11"

[lints]
workspace = true
