[package]
name = "flightsim-input"
description = "入力マッピングと視点制御。"
version.workspace = true
edition.workspace = true
# ADR-0007: Bevy 0.18.1 の MSRV。純 Rust 側 (core/fdm/world/sim/tilegen) は
# 1.85 のまま据え置き、古いツールチェーンで動く性質を維持する。
rust-version = "1.89"
license.workspace = true

[dependencies]
flightsim-core.workspace = true
flightsim-fdm.workspace = true
bevy.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Opt-in HOTAS adapter; the same version is already used by Bevy 0.18.1.
gilrs = "0.11.2"

[lints]
workspace = true
