[package]
name = "flightsim-render"
description = "描画。地形メッシュの GPU 投入、floating origin、大気散乱。"
version.workspace = true
edition.workspace = true
# ADR-0007: Bevy 0.18.1 の MSRV。純 Rust 側 (core/fdm/world/sim/tilegen) は
# 1.85 のまま据え置き、古いツールチェーンで動く性質を維持する。
rust-version = "1.89"
license.workspace = true

[dependencies]
flightsim-core.workspace = true
flightsim-fdm.workspace = true
flightsim-world.workspace = true
flightsim-sim.workspace = true
bevy.workspace = true
# fdm / core の公開 API に現れる f64 の型を扱うため。
glam.workspace = true

[dev-dependencies]
criterion.workspace = true
# Already used by Bevy; validate the actual procedural WGSL helper without a GPU.
naga = { version = "27.0.3", features = ["wgsl-in"] }

[lints]
workspace = true

[[bench]]
name = "scenery_mesh"
harness = false

[[bench]]
name = "terrain_polar_normals"
harness = false
