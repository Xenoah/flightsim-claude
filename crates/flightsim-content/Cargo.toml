[package]
name = "flightsim-content"
description = "Bounded, data-only local terrain package validation and installation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
flightsim-core.workspace = true
flightsim-world.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rawzip = "0.5.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tempfile = "3"
fs2 = "0.4"

[lints]
workspace = true
