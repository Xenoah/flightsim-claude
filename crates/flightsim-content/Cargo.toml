[package]
name = "flightsim-content"
description = "Bounded, data-only local terrain package validation and installation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Explicit opt-in; local imports and the current app have no HTTP dependency.
downloads = ["dep:ureq", "dep:url", "dep:httparse"]

[dependencies]
flightsim-core.workspace = true
flightsim-world.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rawzip = "0.5.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tempfile = "3"
fs2 = "0.4"
# Resolver/transport hooks are explicitly unversioned in ureq. Pin the audited API.
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"], optional = true }
url = { version = "2.5.8", optional = true }
httparse = { version = "1.10.1", optional = true }

[[example]]
name = "download_region"
required-features = ["downloads"]

[lints]
workspace = true
