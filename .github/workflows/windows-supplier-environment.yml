name: Windows supplier environment probe

on:
  push:
    branches: [qualification/windows-supplier-probe]

# Environment discovery only. No build, app execution, qualification or release.
permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: 'lf'
  PYTHONUTF8: '1'
  RUSTUP_AUTO_INSTALL: '0'

concurrency:
  group: windows-supplier-environment-${{ github.sha }}
  cancel-in-progress: false

jobs:
  environment_facts:
    name: observe installed suppliers without building the application
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test the environment-only export boundary without compiling
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p test_windows_supplier_environment.py -v
          if ($LASTEXITCODE -ne 0) { throw 'environment-only export boundary tests failed' }
          python -m unittest discover -s scripts/tests -p test_analytical_runtime_facts.py -v
          if ($LASTEXITCODE -ne 0) { throw 'runtime collector boundary tests failed' }
      - name: Install the authorized official Rust 1.93 x64 MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93.0-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'pinned toolchain installation failed' }
      - name: Collect environment-only supplier facts into private storage
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SOURCE_SHA) { throw 'probe source identity mismatch' }
          $previous = git rev-parse HEAD^
          if ($LASTEXITCODE -ne 0 -or $previous -ne 'e60d5944c7e201b4b3b760f55616e890cb241d17') { throw 'probe predecessor mismatch' }
          $base = git rev-parse HEAD^^
          if ($LASTEXITCODE -ne 0 -or $base -ne '55094fa928fbb8f907a2103740ee6824171c26e7') { throw 'probe baseline mismatch' }
          python scripts/probe-windows-supplier-environment.py `
            --source-sha $env:EXPECTED_SOURCE_SHA `
            --private (Join-Path $env:RUNNER_TEMP 'supplier-environment-private') `
            --evidence (Join-Path $env:RUNNER_TEMP 'supplier-environment-public')
          if ($LASTEXITCODE -ne 0) { throw 'environment-only supplier collection failed' }
      - name: Revalidate exact public bytes against private installed evidence
        id: evidence
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          python scripts/probe-windows-supplier-environment.py `
            --validate `
            --source-sha $env:EXPECTED_SOURCE_SHA `
            --private (Join-Path $env:RUNNER_TEMP 'supplier-environment-private') `
            --evidence (Join-Path $env:RUNNER_TEMP 'supplier-environment-public')
          if ($LASTEXITCODE -ne 0) { throw 'environment-only export validation failed; no upload allowed' }
          'validated=true' >> $env:GITHUB_OUTPUT
      # No cache, raw log, notice text, executable or private-directory upload.
      - name: Upload only the two validated bounded JSON files
        if: success() && steps.evidence.outputs.validated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-supplier-environment-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/supplier-environment-public/runtime-facts.json
            ${{ runner.temp }}/supplier-environment-public/environment-only.json
          if-no-files-found: error
          retention-days: 7
