name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# ビルド側は読み取りだけ。contents: write は、ソースを実行しない publish
# ジョブだけに限定する。
permissions:
  contents: read

# Release input hashes must have identical bytes on Linux and Windows checkouts.
# Process-local Git configuration; no runner/account settings are persisted.
env:
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: 'lf'
  PYTHONUTF8: '1'

concurrency:
  # 異なる main commit が近接して完了しても、同じ version/tag を並行操作しない。
  group: release-main
  cancel-in-progress: false

jobs:
  authorize:
    name: authorize exact binary publication
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      source_inventory_sha256: ${{ steps.gate.outputs.source_inventory_sha256 }}
      release_inventory_sha256: ${{ steps.gate.outputs.release_inventory_sha256 }}
      authorization_sha256: ${{ steps.gate.outputs.authorization_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check version, exact payload, rights evidence and publication authorization
        id: gate
        run: |
          python3 scripts/check-release-authorization.py --allow-blocked \
            --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"

  build_windows:
    name: build authorized Windows bundle
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: windows-latest
    timeout-minutes: 360
    outputs:
      bundle: ${{ steps.version.outputs.bundle }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      # workflow_run は既定ブランチを checkout し得るため、CI が検査した SHA を
      # 明示する。認証情報は build.rs から読めないよう永続化しない。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Recheck the exact authorization before any build or packaging
        shell: pwsh
        env:
          EXPECTED_INVENTORY: ${{ needs.authorize.outputs.release_inventory_sha256 }}
          EXPECTED_SOURCE: ${{ needs.authorize.outputs.source_inventory_sha256 }}
          EXPECTED_AUTHORIZATION: ${{ needs.authorize.outputs.authorization_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $report = python scripts/check-release-authorization.py `
            --inventory-file (Join-Path $env:RUNNER_TEMP 'release-inventory.json')
          if ($LASTEXITCODE -ne 0) { throw 'binary publication authorization failed' }
          $gate = ($report -join "`n") | ConvertFrom-Json
          if (-not $gate.authorized -or
              $gate.release_inventory_sha256 -ne $env:EXPECTED_INVENTORY -or
              $gate.source_inventory_sha256 -ne $env:EXPECTED_SOURCE -or
              $gate.authorization_sha256 -ne $env:EXPECTED_AUTHORIZATION) {
            throw 'authorization or actual release input bytes changed between jobs'
          }

      - name: Test component dialog separately from diagnostic scene capture
        shell: pwsh
        run: ./scripts/tests/test-component-terms-dialog.ps1

      - name: Install the tested Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          rustup target add x86_64-pc-windows-msvc

      - name: Detect and validate the workspace version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq 'flightsim-app' })
          if ($package.Count -ne 1) {
            throw "cargo metadata did not return exactly one flightsim-app package"
          }

          $version = [string]$package[0].version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            throw "workspace version is not SemVer: $version"
          }

          $workspaceVersions = @(
            $metadata.packages |
              Where-Object { $_.name -like 'flightsim-*' } |
              ForEach-Object { [string]$_.version } |
              Sort-Object -Unique
          )
          if ($workspaceVersions.Count -ne 1 -or $workspaceVersions[0] -ne $version) {
            throw "workspace packages do not share one version: $($workspaceVersions -join ', ')"
          }

          $tag = "v$version"
          $bundle = "flightsim-claude-$tag-windows-x86_64.zip"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "bundle=$bundle" >> $env:GITHUB_OUTPUT

      # One fresh dual audit; the ordinary executable is packaged without rebuilding.
      - name: Fetch the exact private upstream source reference
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'ordinary-upstream-reference'
          New-Item -ItemType Directory -Path $directory -ErrorAction Stop | Out-Null
          $reference = Join-Path $directory 'bevy_core_pipeline-0.18.1.crate'
          curl.exe --fail --location --silent --show-error --proto '=https' `
            --max-time 120 --retry 2 --max-filesize 4194304 --output $reference `
            https://static.crates.io/crates/bevy_core_pipeline/bevy_core_pipeline-0.18.1.crate
          if ($LASTEXITCODE -ne 0) { throw 'private upstream reference download failed' }
          if ((Get-FileHash -Algorithm SHA256 $reference).Hash.ToLowerInvariant() -ne
              '4d0810e85c2436e50c67448d48a83bf0bb1b5849899619ae2c7ea817221e9172') {
            throw 'private reference differs from reviewed source'
          }

      - name: Capture and audit the final source once
        id: native_capture
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python -B scripts/capture-analytical-swift-msvc.py `
            --repo $env:GITHUB_WORKSPACE --source-sha $env:SOURCE_SHA `
            --private (Join-Path $env:RUNNER_TEMP 'ordinary-build-private') `
            --evidence (Join-Path $env:RUNNER_TEMP 'ordinary-build-text') `
            --upstream-archive (Join-Path $env:RUNNER_TEMP 'ordinary-upstream-reference/bevy_core_pipeline-0.18.1.crate')
          if ($LASTEXITCODE -ne 0) { throw 'same-build native capture failed' }

      - name: Assemble and verify the same-build ordinary release
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python -B scripts/prepare-ordinary-full-release.py `
            --repo $env:GITHUB_WORKSPACE --expected-sha $env:SOURCE_SHA `
            --build-private (Join-Path $env:RUNNER_TEMP 'ordinary-build-private') `
            --build-text (Join-Path $env:RUNNER_TEMP 'ordinary-build-text') `
            --private (Join-Path $env:RUNNER_TEMP 'ordinary-final-private') `
            --output (Join-Path $env:RUNNER_TEMP 'ordinary-release-artifact')
          if ($LASTEXITCODE -ne 0) { throw 'ordinary review applicability or final extracted smoke failed' }

      - name: Revalidate every final original immediately before upload
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python -B scripts/prepare-ordinary-full-release.py --validate-only `
            --repo $env:GITHUB_WORKSPACE --expected-sha $env:SOURCE_SHA `
            --build-private (Join-Path $env:RUNNER_TEMP 'ordinary-build-private') `
            --build-text (Join-Path $env:RUNNER_TEMP 'ordinary-build-text') `
            --private (Join-Path $env:RUNNER_TEMP 'ordinary-final-private') `
            --output (Join-Path $env:RUNNER_TEMP 'ordinary-release-artifact')
          if ($LASTEXITCODE -ne 0) { throw 'original final evidence changed before upload' }

      - name: Revalidate bounded native facts after a failed final check
        id: failure_native_facts
        if: failure() && steps.native_capture.outcome == 'success' && steps.version.outcome == 'success'
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $facts = Join-Path $env:RUNNER_TEMP 'ordinary-failed-native-facts.json'
          $top = 'flightsim-claude-v' + $env:RELEASE_VERSION + '-windows-x86_64'
          python -B scripts/project-ordinary-native-evidence.py `
            --repo $env:GITHUB_WORKSPACE --expected-sha $env:SOURCE_SHA `
            --build-private (Join-Path $env:RUNNER_TEMP 'ordinary-build-private') `
            --build-text (Join-Path $env:RUNNER_TEMP 'ordinary-build-text') `
            --bundle (Join-Path $env:RUNNER_TEMP ('ordinary-final-private/staged/' + $top)) `
            --runtime-facts-private (Join-Path $env:RUNNER_TEMP 'ordinary-final-private/runtime-facts') > $facts
          if ($LASTEXITCODE -ne 0) { throw 'failed-run native facts could not be independently revalidated' }

      - name: Retain revalidated failed-run facts without publication inputs
        if: failure() && steps.failure_native_facts.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordinary-failed-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ordinary-failed-native-facts.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain successful bounded ordinary native evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordinary-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ordinary-release-artifact/ordinary-native-review.json
            ${{ runner.temp }}/ordinary-release-artifact/ordinary-release-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the verified bundle for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ordinary-release-artifact/${{ steps.version.outputs.bundle }}
            ${{ runner.temp }}/ordinary-release-artifact/${{ steps.version.outputs.bundle }}.sha256
            ${{ runner.temp }}/ordinary-release-artifact/release-metadata.json
            ${{ runner.temp }}/ordinary-release-artifact/release-notes.md
            ${{ runner.temp }}/ordinary-release-artifact/ordinary-release-evidence.json
            ${{ runner.temp }}/ordinary-release-artifact/flightsim-claude-${{ steps.version.outputs.tag }}-windows-smoke.png
            ${{ runner.temp }}/ordinary-release-artifact/flightsim-claude-${{ steps.version.outputs.tag }}-windows-smoke-swift.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: tag and publish prerelease
    needs: [authorize, build_windows]
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # このジョブではリポジトリを checkout せず、検証済み artifact 以外の
      # リポジトリコードを実行しない。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact

      - name: Verify release metadata and archive digest
        shell: bash
        env:
          EXPECTED_BUNDLE: ${{ needs.build_windows.outputs.bundle }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_TAG: ${{ needs.build_windows.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.build_windows.outputs.version }}
          EXPECTED_INVENTORY: ${{ needs.authorize.outputs.release_inventory_sha256 }}
          EXPECTED_AUTHORIZATION: ${{ needs.authorize.outputs.authorization_sha256 }}
        run: |
          set -euo pipefail
          metadata=release-artifact/release-metadata.json
          test -f "$metadata"

          bundle="$(jq -er '.bundle' "$metadata")"
          source_sha="$(jq -er '.source_sha' "$metadata")"
          tag="$(jq -er '.tag' "$metadata")"
          version="$(jq -er '.version' "$metadata")"
          expected_digest="$(jq -er '.sha256' "$metadata")"
          checksum="release-artifact/$bundle.sha256"

          [[ "$bundle" == "$EXPECTED_BUNDLE" ]]
          [[ "$source_sha" == "$EXPECTED_SHA" ]]
          [[ "$tag" == "$EXPECTED_TAG" ]]
          [[ "$version" == "$EXPECTED_VERSION" ]]
          [[ "$tag" == "v$version" ]]
          [[ "$(jq -er '.release_inventory_sha256' "$metadata")" == "$EXPECTED_INVENTORY" ]]
          [[ "$(jq -er '.authorization_sha256' "$metadata")" == "$EXPECTED_AUTHORIZATION" ]]
          [[ "$EXPECTED_INVENTORY" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_AUTHORIZATION" =~ ^[0-9a-f]{64}$ ]]
          [[ "$bundle" =~ ^flightsim-claude-v[0-9A-Za-z.+-]+-windows-x86_64\.zip$ ]]
          [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
          test -f "release-artifact/$bundle"
          test -f "$checksum"

          actual_digest="$(sha256sum "release-artifact/$bundle" | cut -d' ' -f1)"
          [[ "$actual_digest" == "$expected_digest" ]]
          (cd release-artifact && sha256sum --check "$bundle.sha256")
          evidence=release-artifact/ordinary-release-evidence.json
          test -s "$evidence"
          [[ "$(sha256sum "$evidence" | cut -d' ' -f1)" == "$(jq -er '.evidence_sha256' "$metadata")" ]]
          notes=release-artifact/release-notes.md
          test -s "$notes"
          [[ "$(sha256sum "$notes" | cut -d' ' -f1)" == "$(jq -er '.notes_sha256' "$metadata")" ]]
          [[ "$(jq -er '.notes_sha256' "$metadata")" == "$(jq -er '.bindings.publication_notes.sha256' "$evidence")" ]]
          ! grep -q '@SOURCE_SHA@' "$notes"
          [[ "$(jq -er '.kind' "$evidence")" == 'ordinary_final_same_build_evidence_not_authority' ]]
          [[ "$(jq -er '.source_sha' "$evidence")" == "$EXPECTED_SHA" ]]
          [[ "$(jq -er '.release_inventory_sha256' "$evidence")" == "$EXPECTED_INVENTORY" ]]
          [[ "$(jq -er '.authorization_sha256' "$evidence")" == "$EXPECTED_AUTHORIZATION" ]]
          [[ "$(jq -er '.bindings.archive.sha256' "$evidence")" == "$expected_digest" ]]
          jq -e '.component_terms.recipient_assent_collected == false and .component_terms.dialog_tested_by_smoke == false and .component_terms.source_sha == .source_sha and .component_terms.source_tree == .source_tree and .component_terms.executable == .files["flightsim-app.exe"]' "$evidence" >/dev/null
          jq -e '.applicability.conditions_matched == true and (.scenes | keys == ["light-single-cockpit", "swift-sport-chase"])' "$evidence" >/dev/null
          [[ "$(sha256sum "release-artifact/flightsim-claude-$EXPECTED_TAG-windows-smoke.png" | cut -d' ' -f1)" == "$(jq -er '.scenes["light-single-cockpit"].screenshot.sha256' "$evidence")" ]]
          [[ "$(sha256sum "release-artifact/flightsim-claude-$EXPECTED_TAG-windows-smoke-swift.png" | cut -d' ' -f1)" == "$(jq -er '.scenes["swift-sport-chase"].screenshot.sha256' "$evidence")" ]]
          [[ "$(stat -c %s "release-artifact/flightsim-claude-$EXPECTED_TAG-windows-smoke.png")" == "$(jq -er '.scenes["light-single-cockpit"].screenshot.bytes' "$evidence")" ]]
          [[ "$(stat -c %s "release-artifact/flightsim-claude-$EXPECTED_TAG-windows-smoke-swift.png")" == "$(jq -er '.scenes["swift-sport-chase"].screenshot.bytes' "$evidence")" ]]
          if find release-artifact -mindepth 1 ! -type f | grep -q .; then
            echo 'unexpected non-file publication artifact' >&2
            exit 1
          fi
          actual_members="$(find release-artifact -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          expected_members="$(printf '%s\n' "$EXPECTED_BUNDLE" "$EXPECTED_BUNDLE.sha256" \
            release-metadata.json release-notes.md ordinary-release-evidence.json \
            "flightsim-claude-$EXPECTED_TAG-windows-smoke.png" \
            "flightsim-claude-$EXPECTED_TAG-windows-smoke-swift.png" | LC_ALL=C sort)"
          [[ "$actual_members" == "$expected_members" ]]

      - name: Create the tag if absent and publish idempotently
        shell: bash
        env:
          BUNDLE: ${{ needs.build_windows.outputs.bundle }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ needs.build_windows.outputs.tag }}
        run: |
          set -euo pipefail

          tag_error="$RUNNER_TEMP/release-tag-get.err"
          tag_endpoint="repos/$REPOSITORY/git/ref/tags/$TAG"
          if gh api "$tag_endpoint" --silent 2>"$tag_error"; then
            # Prove that an exact tag ref exists before resolving it to a commit;
            # the commits endpoint alone could otherwise resolve a same-named branch.
            tag_commit="$(gh api "repos/$REPOSITORY/commits/$TAG" --jq '.sha')"
            if [[ "$tag_commit" != "$SOURCE_SHA" ]]; then
              echo "$TAG already points to $tag_commit, not $SOURCE_SHA" >&2
              exit 1
            fi
          elif grep -Eq '\(HTTP 404\)|HTTP/[0-9.]+ 404' "$tag_error"; then
            gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$SOURCE_SHA" >/dev/null
          else
            cat "$tag_error" >&2
            exit 1
          fi

          archive="release-artifact/$BUNDLE"
          checksum="$archive.sha256"
          evidence=release-artifact/ordinary-release-evidence.json
          notes=release-artifact/release-notes.md
          screenshot="release-artifact/flightsim-claude-$TAG-windows-smoke.png"
          swift_screenshot="release-artifact/flightsim-claude-$TAG-windows-smoke-swift.png"
          test -s "$screenshot"
          test -s "$swift_screenshot"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPOSITORY" \
              --title "$TAG" --notes-file "$notes" --prerelease
            gh release upload "$TAG" "$archive" "$checksum" "$screenshot" "$swift_screenshot" "$evidence" --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" "$archive" "$checksum" "$screenshot" "$swift_screenshot" "$evidence" --repo "$REPOSITORY" \
              --verify-tag --target "$SOURCE_SHA" --title "$TAG" \
              --notes-file "$notes" --prerelease
          fi

  cleanup_merged_branch:
    name: remove merged legacy branch once
    needs: [build_windows, publish]
    if: >-
      needs.publish.result == 'success' &&
      needs.build_windows.outputs.version == '0.6.0-alpha.5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # この ref は内容が main に取り込まれたことを確認済み。alpha.5 のときだけ、
      # 既知の旧 SHA のままなら削除する。後日同名 branch が再利用されていたら、
      # 新しい作業を消さずに失敗させる。
      - name: Delete the known merged branch if it still exists
        shell: bash
        env:
          EXPECTED_SHA: 590177a7d51550eb66470a76ec3fa819b61a84ae
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: agent/landing-gear-prerelease
        run: |
          set -euo pipefail
          repository_dir="$RUNNER_TEMP/legacy-ref-cleanup.git"
          error_log="$RUNNER_TEMP/legacy-ref-ls-remote.err"
          git init --bare "$repository_dir" >/dev/null
          git -C "$repository_dir" remote add origin "https://github.com/$REPOSITORY.git"
          gh auth setup-git

          set +e
          remote_line="$(git -C "$repository_dir" ls-remote --exit-code --heads             origin "refs/heads/$HEAD_REF" 2>"$error_log")"
          status=$?
          set -e
          case "$status" in
            0) ;;
            2)
              echo "refs/heads/$HEAD_REF is already absent"
              exit 0
              ;;
            *)
              cat "$error_log" >&2
              exit "$status"
              ;;
          esac

          remote_sha="$(cut -f1 <<<"$remote_line")"
          [[ "$remote_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
            echo "ref now points to $remote_sha; refusing to delete new work" >&2
            exit 1
          fi

          git -C "$repository_dir" push --porcelain             --force-with-lease="refs/heads/$HEAD_REF:$EXPECTED_SHA"             origin ":refs/heads/$HEAD_REF"
          echo "deleted refs/heads/$HEAD_REF at $EXPECTED_SHA"
