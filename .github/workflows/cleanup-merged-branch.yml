name: Cleanup merged agent branch

on:
  pull_request_target:
    types: [closed]

# pull_request_target has access to a write-capable token. Keep the default at
# no access and grant only ref deletion to the single job below. No PR code is
# checked out or executed.
permissions: {}

jobs:
  cleanup:
    name: remove merged same-repository agent branch
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Delete the unchanged merged head ref
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The job-level condition is the primary guard. Repeat validation in
          # the shell so future workflow edits cannot broaden deletion silently.
          [[ "$HEAD_REF" == agent/* ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          # A branch name is untrusted event data and may contain slashes or
          # other URL-significant bytes. Encode it as one API path component.
          encoded_ref="$(python3 - <<'PY'
          import os
          import urllib.parse

          print(urllib.parse.quote(os.environ["HEAD_REF"], safe=""))
          PY
          )"
          get_url="$GITHUB_API_URL/repos/$REPOSITORY/git/ref/heads/$encoded_ref"
          delete_url="$GITHUB_API_URL/repos/$REPOSITORY/git/refs/heads/$encoded_ref"
          response_file="$(mktemp)"
          delete_response="$(mktemp)"
          trap 'rm -f "$response_file" "$delete_response"' EXIT

          status="$(curl --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$get_url")"

          case "$status" in
            200) ;;
            404)
              echo "merged head ref is already absent"
              exit 0
              ;;
            *)
              echo "failed to read merged head ref (HTTP $status)" >&2
              exit 1
              ;;
          esac

          current_sha="$(python3 - "$response_file" <<'PY'
          import json
          import pathlib
          import re
          import sys

          value = json.loads(pathlib.Path(sys.argv[1]).read_text())["object"]["sha"]
          if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value):
              raise SystemExit("GitHub returned an invalid ref SHA")
          print(value)
          PY
          )"

          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "head ref changed after the merged PR; refusing to delete it" >&2
            exit 1
          fi

          delete_status="$(curl --silent --show-error --request DELETE \
            --output "$delete_response" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$delete_url")"

          case "$delete_status" in
            204) echo "deleted the unchanged merged agent branch" ;;
            404) echo "merged head ref disappeared before deletion" ;;
            *)
              echo "failed to delete merged head ref (HTTP $delete_status)" >&2
              exit 1
              ;;
          esac
