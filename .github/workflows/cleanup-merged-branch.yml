name: Cleanup merged agent branch

on:
  pull_request_target:
    types: [closed]

# pull_request_target has access to a write-capable token. Keep the default at
# no access and grant only ref deletion to the single job below. No PR code is
# checked out or executed.
permissions: {}

jobs:
  cleanup:
    name: remove merged same-repository agent branch
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Delete the unchanged merged head ref
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The job-level condition is the primary guard. Repeat validation in
          # the shell so future workflow edits cannot broaden deletion silently.
          [[ "$HEAD_REF" == agent/* ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          # Git's explicit force-with-lease makes the expected SHA check and
          # deletion one atomic server-side ref update. A GET followed by a
          # REST DELETE has a race where newly pushed work can be deleted.
          repository_dir="$RUNNER_TEMP/ref-cleanup.git"
          error_log="$RUNNER_TEMP/ref-cleanup-ls-remote.err"
          git init --bare "$repository_dir" >/dev/null
          git -C "$repository_dir" remote add origin "https://github.com/$REPOSITORY.git"
          gh auth setup-git

          set +e
          remote_line="$(git -C "$repository_dir" ls-remote --exit-code --heads             origin "refs/heads/$HEAD_REF" 2>"$error_log")"
          status=$?
          set -e
          case "$status" in
            0) ;;
            2)
              echo "merged head ref is already absent"
              exit 0
              ;;
            *)
              cat "$error_log" >&2
              exit "$status"
              ;;
          esac

          remote_sha="$(cut -f1 <<<"$remote_line")"
          [[ "$remote_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
            echo "head ref changed after the merged PR; refusing to delete it" >&2
            exit 1
          fi

          git -C "$repository_dir" push --porcelain             --force-with-lease="refs/heads/$HEAD_REF:$EXPECTED_SHA"             origin ":refs/heads/$HEAD_REF"
          echo "deleted the unchanged merged agent branch at $EXPECTED_SHA"
