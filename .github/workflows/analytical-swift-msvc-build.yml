name: Analytical Swift MSVC build evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytical-swift-msvc-build.yml'
      - 'scripts/capture-analytical-swift-msvc.py'
      - 'scripts/analytical-swift-capture-contract.json'

# Separate engineering build only. No ordinary candidate/release gate linkage.
permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: 'lf'
  PYTHONUTF8: '1'

concurrency:
  group: analytical-swift-msvc-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build_evidence:
    name: collect private dual MSVC builds and export bounded text
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact native MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'pinned toolchain installation failed' }
      - name: Exercise capture and export boundaries without compiling
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p test_analytical_swift_capture.py -v
          if ($LASTEXITCODE -ne 0) { throw 'capture/export boundary tests failed' }
      # No cache: executables, raw metadata, notices, targets and replay stay local.
      - name: Capture actual build-only evidence and run same-machine audit
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          python scripts/capture-analytical-swift-msvc.py `
            --source-sha $env:EXPECTED_SOURCE_SHA `
            --private (Join-Path $env:RUNNER_TEMP 'analytical-swift-private') `
            --evidence (Join-Path $env:RUNNER_TEMP 'analytical-swift-text')
          if ($LASTEXITCODE -ne 0) { throw 'analytical build evidence failed; all qualification gates remain open' }
      - name: Independently validate the exact text export after success or failure
        if: always()
        id: evidence
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          python scripts/capture-analytical-swift-msvc.py `
            --validate-evidence (Join-Path $env:RUNNER_TEMP 'analytical-swift-text') `
            --source-sha $env:EXPECTED_SOURCE_SHA `
            --private (Join-Path $env:RUNNER_TEMP 'analytical-swift-private')
          if ($LASTEXITCODE -ne 0) { throw 'text export validation failed; no upload allowed' }
          'validated=true' >> $env:GITHUB_OUTPUT
      - name: Upload only the validated bounded engineering JSON
        if: always() && steps.evidence.outputs.validated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytical-swift-msvc-text-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/analytical-swift-text/build-evidence.json
          if-no-files-found: error
          retention-days: 7
